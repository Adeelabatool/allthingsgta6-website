<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AllThingsGTA6 — GTA 6 news, wiki, analysis and tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12081f"/>
      <stop offset="0.55" stop-color="#2a103f"/>
      <stop offset="1" stop-color="#5a1a4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="0.5" stop-color="#b34bff"/>
      <stop offset="1" stop-color="#3fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.06" fill="#ffffff">
    <rect x="0" y="0" width="1200" height="2"/>
    <rect x="0" y="4" width="1200" height="1"/>
  </g>
  <g transform="translate(90,150)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#3fd0ff">UNOFFICIAL FAN INTELLIGENCE</text>
    <text x="0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" fill="#ffffff">ALL<tspan fill="url(#accent)">THINGS</tspan>GTA6</text>
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="500" fill="#e6d8f0">GTA 6 news, wiki, analysis &amp; tools</text>
    <text x="0" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#b79fce">Release date: November 19, 2026 · PS5 &amp; Xbox Series X|S</text>
  </g>
  <rect x="90" y="470" width="1020" height="4" rx="2" fill="url(#accent)"/>
  <text x="90" y="540" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8f7aa8">Independent fan project — not affiliated with Rockstar Games or Take-Two Interactive.</text>
</svg>
