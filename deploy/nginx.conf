# /etc/nginx/sites-available/allthingsgta6
# Symlink to sites-enabled, then: nginx -t && systemctl reload nginx
# Get SSL: certbot --nginx -d allthingsgta6.com -d www.allthingsgta6.com

server {
    listen 80;
    listen [::]:80;
    server_name allthingsgta6.com www.allthingsgta6.com;

    # Certbot will rewrite this to 443 after issuing SSL
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout                 60s;
    }

    # Static assets — long cache
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpe?g|gif|svg|webp|avif|mp4|webm)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    client_max_body_size 10M;
}
